name: war_AI GPU smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-smoke:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify NVIDIA driver
        run: nvidia-smi

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip setuptools==83.0.0
          python -m pip install -e ".[training,test,quality]" pip-audit==2.10.1
          pip-audit --skip-editable

      - name: Verify CUDA-enabled PyTorch
        run: |
          python - <<'PY'
          import torch

          if not torch.cuda.is_available():
              raise SystemExit("CUDA is unavailable in the selected PyTorch build.")

          result = torch.ones((2, 2), device="cuda").sum()
          torch.cuda.synchronize()
          print(f"PyTorch {torch.__version__}; CUDA smoke result: {result.item()}")
          PY
